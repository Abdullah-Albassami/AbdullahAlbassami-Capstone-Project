{% if form.errors %}<p class="form-alert" role="alert">Please correct the errors below.</p>{% endif %}
{{ form.non_field_errors }}
{% for field in form %}
  <div class="field">
    {{ field.label_tag }}
    {{ field }}
    {% if field.help_text %}<div class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endfor %}
